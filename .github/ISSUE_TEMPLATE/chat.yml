name: Chat Report
description: AI Agent와의 대화 내용이나 채팅 기반의 작업 요청을 기록합니다.
title: "[Chat]: "
labels: ["chat"]
body:
  - type: markdown
    attributes:
      value: |
        AI Agent(Antigravity)와의 대화 핵심 내용을 기록하는 템플릿입니다.
  
  - type: textarea
    id: ask
    attributes:
      label: Ask
      description: 사용자(User)의 질문, 요청 사항, 혹은 해결하고자 하는 문제를 기록해주세요.
      placeholder: "예: Vitest와 Jest 중 어떤 것이 이 프로젝트에 더 적합한가요?"
    validations:
      required: true

  - type: textarea
    id: answer
    attributes:
      label: Answer
      description: AI(Agent)의 답변, 제안된 솔루션, 혹은 분석 결과를 기록해주세요.
      placeholder: "예: Vitest가 Vite 환경과 호환성이 좋고 속도가 빠르므로 추천합니다."
    validations:
      required: true
